name: Deploy (Vercel CLI)

# Publicação pela CLI do Vercel, sem a integração Git do Vercel.
# PR do próprio repositório -> preview + comentário com a URL; push em main -> produção (environment "production").
# Os dois só rodam depois do job de QA. PR de fork não recebe secrets e não publica.
# A CLI lê VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID do ambiente.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash  # bash --noprofile --norc -eo pipefail

env:
  VERCEL_CLI: vercel@65.1.0
  URL_VALIDA: '^https://[a-z0-9.-]+\.vercel\.app$'

jobs:
  qa:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Dependências do QA
        run: |
          python -m pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Autoria dos commits (PR)
        if: github.event_name == 'pull_request'
        env:
          INTERVALO: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: python tools/verificar_autoria.py "$INTERVALO"

      - name: Autoria dos commits (main, só autor)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          # Após um force-push, o commit "before" pode não existir mais no repositório.
          if git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            INTERVALO="${ANTES}..${DEPOIS}"
          else
            echo "::notice::commit anterior ${ANTES} não existe mais (histórico reescrito); verificando só o commit atual"
            INTERVALO="${DEPOIS}~1..${DEPOIS}"
          fi
          python tools/verificar_autoria.py --so-autor "$INTERVALO"

      - name: QA Playwright
        env:
          QA_PROIBIDOS_EXTRA: ${{ secrets.QA_PROIBIDOS_EXTRA }}
        run: python tools/qa/qa.py

  preview:
    if: github.event_name == 'pull_request'
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_C9EPO9569cZ4XFdjxzr3iRVWbpFq' }}
    steps:
      - name: Conferir secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::warning::VERCEL_TOKEN ou VERCEL_ORG_ID ausente nos secrets; preview pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.secrets.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: "22"

      - name: Preview
        id: preview
        if: steps.secrets.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --yes | tail -n 1)
          if [[ ! $url =~ $URL_VALIDA ]]; then
            echo "::error::URL de preview inesperada"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar a URL no PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview do Vercel para $SHA: $URL"

  producao:
    if: github.event_name == 'push'
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_C9EPO9569cZ4XFdjxzr3iRVWbpFq' }}
    steps:
      - name: Conferir secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_TOKEN ou VERCEL_ORG_ID ausente nos secrets; produção não publicada."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prod --yes | tail -n 1)
          if [[ ! $url =~ $URL_VALIDA ]]; then
            echo "::error::URL de produção inesperada"
            exit 1
          fi
          echo "Produção: $url" >> "$GITHUB_STEP_SUMMARY"
