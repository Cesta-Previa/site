name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Dependências do QA
        run: |
          python -m pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Autoria dos commits (PR)
        if: github.event_name == 'pull_request'
        env:
          INTERVALO: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: python tools/verificar_autoria.py "$INTERVALO"

      - name: Autoria dos commits (main, só autor)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          # Após um force-push, o commit "before" pode não existir mais no repositório.
          if git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            INTERVALO="${ANTES}..${DEPOIS}"
          else
            echo "::notice::commit anterior ${ANTES} não existe mais (histórico reescrito); verificando só o commit atual"
            INTERVALO="${DEPOIS}~1..${DEPOIS}"
          fi
          python tools/verificar_autoria.py --so-autor "$INTERVALO"

      - name: Versão dos assets
        run: python tools/bump_versao.py --checar

      - name: QA Playwright
        env:
          QA_PROIBIDOS_EXTRA: ${{ secrets.QA_PROIBIDOS_EXTRA }}
        run: python tools/qa/qa.py

      - name: Screenshots do QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-screenshots
          path: tools/qa/_saida/
          retention-days: 14

      # Checagens informativas: não bloqueiam o PR.
      - name: pip-audit (informativo)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r tools/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Servir a pasta para Lighthouse e axe
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2

      - name: Lighthouse CI (informativo)
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 autorun --config=tools/lighthouserc.json

      - name: axe (informativo)
        continue-on-error: true
        run: |
          for p in / /demo/ /acuracia/ /boletim/ /metodologia/ /contato/ /privacidade/ /termos/; do
            npx --yes @axe-core/cli@4.14.0 "http://127.0.0.1:8000$p" --chromedriver-path "$CHROMEWEBDRIVER/chromedriver" --tags wcag2a,wcag2aa,wcag21aa,wcag22aa || true
          done
